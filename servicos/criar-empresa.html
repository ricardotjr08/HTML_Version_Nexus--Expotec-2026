<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Criar empresa | Nexus</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><link href="../assets/css/principal.css" rel="stylesheet"><link href="../assets/css/planos.css" rel="stylesheet"></head>
<body class="d-flex flex-column min-vh-100"><div data-nexus-header data-base="../" data-internal="true"></div><main class="flex-grow-1 py-5"><div class="container"><div class="row g-4"><div class="col-lg-6"><div class="dashboard-card p-4"><h2>Criar Nova Empresa</h2><form id="form-empresa" class="d-flex flex-column gap-3 mt-3"><div><label class="form-label">Nome</label><input class="form-control bg-dark text-white border-secondary" name="nome" required></div><div><label class="form-label">Descrição</label><textarea class="form-control bg-dark text-white border-secondary" name="descricao"></textarea></div><div><label class="form-label">Plano</label><select class="form-select bg-dark text-white border-secondary" name="plano"><option value="basico">Básico</option><option value="profissional" selected>Profissional</option><option value="enterprise">Enterprise</option></select></div><button class="btn btn-primary">Cadastrar Empresa</button></form></div></div><div class="col-lg-6"><div class="secao-planos p-0"><div class="grid-planos"><div class="card-plano"><div class="nome-plano">Básico</div><div class="preco-plano">R$49</div></div><div class="card-plano popular"><div class="badge-popular">MAIS POPULAR</div><div class="nome-plano">Profissional</div><div class="preco-plano">R$129</div></div></div></div></div></div></div></main><div data-nexus-footer data-base="../"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/js/database.js"></script><script src="../assets/js/app.js"></script><script>const s=NexusDB.session();if(!s)location.replace('../login/login.html');document.getElementById('form-empresa').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);NexusDB.criarEmpresa(s.usuario_id,{nome:fd.get('nome').trim(),descricao:fd.get('descricao').trim(),plano:fd.get('plano')});location.href='workspace.html';});</script></body></html>
