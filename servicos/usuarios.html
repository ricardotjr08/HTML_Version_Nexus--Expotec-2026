<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários | Nexus</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><link href="../assets/css/principal.css" rel="stylesheet"><link href="../assets/css/usuarios.css" rel="stylesheet"></head>
<body class="d-flex flex-column min-vh-100"><div data-nexus-header data-base="../" data-internal="true"></div><main class="flex-grow-1"><div class="container-fluid px-4 py-4"><h2 class="fw-bold text-white mb-3">Convide usuários</h2><div class="d-flex gap-2 mb-4"><button id="btn-convidar" class="btn btn-primary">Convidar</button><button id="btn-criar-cargo" class="btn btn-outline-light">Criar Cargo</button></div><div id="lista-convidados" class="d-flex flex-column gap-2"></div></div></main>
<div class="modal fade modal-dark" id="modal-convite" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="form-convite" class="p-3"><h5 id="convite-titulo">Convidar usuário</h5><label class="form-label mt-2">Nome</label><input id="c-nome" class="form-control" required><label class="form-label mt-2">E-mail</label><input id="c-email" type="email" class="form-control" required><label class="form-label mt-2">Cargo</label><select id="c-cargo" class="form-select"></select><div class="d-flex justify-content-end gap-2 mt-3"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary">Salvar</button></div></form></div></div></div>
<div class="modal fade modal-dark" id="modal-cargos" tabindex="-1"><div class="modal-dialog"><div class="modal-content p-3"><h5>Cargos</h5><form id="form-cargo" class="d-flex gap-2"><input id="cargo-nome" class="form-control" placeholder="Nome do cargo"><button class="btn btn-primary">Criar</button></form><div id="lista-cargos" class="mt-3"></div></div></div></div>
<div data-nexus-footer data-base="../"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/js/database.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/usuarios-static.js"></script></body></html>
