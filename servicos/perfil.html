<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Perfil | Nexus</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><link href="../assets/css/principal.css" rel="stylesheet"><link href="../assets/css/perfil.css" rel="stylesheet"></head><body class="d-flex flex-column min-vh-100"><div data-nexus-header data-base="../" data-internal="true"></div><main class="flex-grow-1 py-5"><div class="container perfil-shell"><div class="perfil-card"><div class="perfil-header"><div class="perfil-avatar" id="avatar">U</div><div><h4 class="text-white fw-bold mb-1">Meu Perfil</h4><p class="text-secondary small mb-0">Gerencie suas informações pessoais.</p></div></div><form id="form-perfil" class="perfil-form"><div class="form-grid"><div><label class="form-label">Nome</label><input id="nome" class="form-control bg-dark text-white border-secondary" required></div><div><label class="form-label">E-mail</label><input id="email" type="email" class="form-control bg-dark text-white border-secondary" required></div></div><div><label class="form-label">Telefone</label><input id="telefone" class="form-control bg-dark text-white border-secondary"></div><div><label class="form-label">Biografia</label><textarea id="bio" class="form-control bg-dark text-white border-secondary" rows="4"></textarea></div><div><label class="form-label">Nova senha</label><input id="senha" type="password" class="form-control bg-dark text-white border-secondary" placeholder="Deixe em branco para manter"></div><div class="d-flex gap-2"><button class="btn btn-primary flex-grow-1">Salvar Alterações</button><a href="workspace.html" class="btn btn-outline-secondary">Voltar</a></div></form></div></div></main><div data-nexus-footer data-base="../"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/js/database.js"></script><script src="../assets/js/app.js"></script><script>const s=NexusDB.session();if(!s)location.replace('../login/login.html');const u=NexusDB.getUsuario(s.usuario_id);document.getElementById('avatar').textContent=u.nome.charAt(0).toUpperCase();document.getElementById('nome').value=u.nome;document.getElementById('email').value=u.email;document.getElementById('telefone').value=u.telefone||'';document.getElementById('bio').value=u.bio||'';document.getElementById('form-perfil').onsubmit=e=>{e.preventDefault();const senha=document.getElementById('senha').value,d={nome:document.getElementById('nome').value.trim(),email:document.getElementById('email').value.trim().toLowerCase(),telefone:document.getElementById('telefone').value.trim(),bio:document.getElementById('bio').value.trim()};if(senha){if(senha.length<8)return alert('A nova senha deve ter pelo menos 8 caracteres');d.senha=senha}NexusDB.atualizarUsuario(u.id,d);alert('Perfil atualizado com sucesso.');};</script></body></html>
