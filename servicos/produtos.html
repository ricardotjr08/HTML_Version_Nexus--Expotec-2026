<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produtos | Nexus</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><link href="../assets/css/principal.css" rel="stylesheet"></head>
<body class="d-flex flex-column min-vh-100"><div data-nexus-header data-base="../" data-internal="true" data-page="produtos"></div><main class="flex-grow-1"><div class="container-fluid px-4 py-4"><h2 class="fw-bold text-white mb-3">Verifique seus Produtos</h2><button id="nova-secao" class="btn btn-primary mb-4">Criar Seção</button><div id="lista-secoes" class="row g-3"></div></div></main><div data-nexus-footer data-base="../"></div>
<div class="modal fade" id="modal-produto" tabindex="-1"><div class="modal-dialog"><div class="modal-content bg-dark text-white"><form id="form-produto" class="p-3"><input type="hidden" id="produto-id"><input type="hidden" id="secao-id"><h5 id="titulo-modal">Novo produto</h5><div class="mb-2"><label class="form-label">Nome</label><input id="produto-nome" class="form-control" required></div><div class="row g-2"><div class="col-6"><label class="form-label">Preço</label><input id="produto-preco" type="number" step="0.01" class="form-control" required></div><div class="col-6"><label class="form-label">Custo</label><input id="produto-custo" type="number" step="0.01" class="form-control" required></div></div><div class="row g-2 mt-1"><div class="col-6"><label class="form-label">Quantidade</label><input id="produto-qtd" type="number" min="0" class="form-control" required></div><div class="col-6"><label class="form-label">Fornecedor</label><input id="produto-fornecedor" class="form-control"></div></div><div class="d-flex justify-content-between mt-3"><button type="button" id="excluir-produto" class="btn btn-outline-danger d-none">Excluir</button><div><button type="button" class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary">Salvar</button></div></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/js/database.js"></script><script src="../assets/js/app.js"></script>
<script>
const s=NexusDB.session();if(!s)location.replace('../login/login.html');let empresaId=s.empresa_id;if(!empresaId){const e=NexusDB.listarEmpresas(s.usuario_id)[0];if(e)empresaId=e.empresa.id;}if(!empresaId)location.replace('workspace.html');
const lista=document.getElementById('lista-secoes'), modal=new bootstrap.Modal(document.getElementById('modal-produto'));
function render(){const secoes=NexusDB.listarSecoes(empresaId);lista.innerHTML='';secoes.forEach(secao=>{const col=document.createElement('div');col.className='col-md-6 col-lg-4';col.innerHTML='<div class="dashboard-card p-3"><div class="d-flex gap-2"><input class="form-control form-control-sm bg-dark text-white border-secondary nome-secao" value="'+secao.nome.replace(/"/g,'&quot;')+'"><button class="btn btn-sm btn-outline-danger excluir-secao">×</button></div><div class="d-flex flex-column gap-2 mt-3 produtos"></div><button class="btn btn-sm btn-outline-light mt-3 adicionar">+ Adicionar produto</button></div>';const produtos=col.querySelector('.produtos');secao.produtos.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='produto-item btn text-start';b.innerHTML='<strong>'+p.nome+'</strong><span class="d-block small text-secondary">Qtd '+p.quantidade+' · R$ '+Number(p.preco).toFixed(2)+'</span>';b.onclick=()=>abrir(secao.id,p);produtos.appendChild(b)});col.querySelector('.nome-secao').onchange=e=>NexusDB.salvarSecao(empresaId,{id:secao.id,nome:e.target.value});col.querySelector('.excluir-secao').onclick=()=>{if(confirm('Excluir seção e seus produtos?')){NexusDB.excluirSecao(empresaId,secao.id);render()}};col.querySelector('.adicionar').onclick=()=>abrir(secao.id,null);lista.appendChild(col)});}
document.getElementById('nova-secao').onclick=()=>{const nome=prompt('Nome da seção');if(nome&&nome.trim()){NexusDB.salvarSecao(empresaId,{nome:nome.trim()});render()}};
function abrir(secaoId,p){document.getElementById('secao-id').value=secaoId;document.getElementById('produto-id').value=p?p.id:'';document.getElementById('produto-nome').value=p?p.nome:'';document.getElementById('produto-preco').value=p?p.preco:'';document.getElementById('produto-custo').value=p?p.custo:'';document.getElementById('produto-qtd').value=p?p.quantidade:'0';document.getElementById('produto-fornecedor').value=p?p.fornecedor:'';document.getElementById('titulo-modal').textContent=p?'Editar produto':'Novo produto';document.getElementById('excluir-produto').classList.toggle('d-none',!p);modal.show()}
document.getElementById('excluir-produto').onclick=()=>{const id=Number(document.getElementById('produto-id').value);if(id&&confirm('Excluir este produto?')){NexusDB.excluirProduto(empresaId,id);modal.hide();render()}};
document.getElementById('form-produto').onsubmit=e=>{e.preventDefault();const dados={id:Number(document.getElementById('produto-id').value)||null,secao_id:Number(document.getElementById('secao-id').value),nome:document.getElementById('produto-nome').value.trim(),preco:document.getElementById('produto-preco').value,custo:document.getElementById('produto-custo').value,quantidade:document.getElementById('produto-qtd').value,fornecedor:document.getElementById('produto-fornecedor').value};if(dados.nome)NexusDB.salvarProduto(empresaId,dados);modal.hide();render()};render();
</script></body></html>
