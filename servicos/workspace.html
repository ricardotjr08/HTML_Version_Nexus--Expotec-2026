<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workspace | Nexus</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><link href="../assets/css/principal.css" rel="stylesheet"></head>
<body class="d-flex flex-column min-vh-100"><div data-nexus-header data-base="../" data-internal="true" data-page="workspace"></div>
<main class="flex-grow-1 py-4"><div class="container workspace-shell"><section class="dashboard-card workspace-hero mb-4 p-4 p-lg-5"><div><span class="workspace-label">Workspace</span><h1 class="fw-bold text-white mb-2" id="boas-vindas"></h1><p class="text-secondary mb-3">Gerencie suas empresas e acesse os módulos do sistema.</p><div class="workspace-actions"><a href="criar-empresa.html" class="btn btn-primary btn-sm">+ Criar empresa</a></div></div><div class="workspace-stats"><div class="workspace-stat"><span class="workspace-stat__label">Empresas</span><strong id="empresa-contagem">0</strong></div><div class="workspace-stat"><span class="workspace-stat__label">Status</span><strong>Ativo</strong></div></div></section>
<div class="workspace-layout"><aside class="workspace-sidebar"><div class="dashboard-card p-3"><div class="workspace-panel-header"><h3>Perfil do usuário</h3></div><a href="perfil.html" class="workspace-user-card text-decoration-none d-flex align-items-center gap-3"><div class="workspace-avatar" id="avatar">U</div><div><h4 class="text-white mb-1" id="nome-usuario"></h4><small class="text-secondary" id="email-usuario"></small></div></a></div></aside><section class="workspace-content"><div class="dashboard-card p-4"><h4 class="text-white fw-bold fs-5">Empresas afiliadas</h4><div class="workspace-company-list mt-3" id="lista-empresas"></div></div></section></div></div></main>
<div data-nexus-footer data-base="../"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/js/database.js"></script><script src="../assets/js/app.js"></script>
<script>
if (!NexusDB.session()) location.replace('../login/login.html');
const s=NexusDB.session(), u=NexusDB.getUsuario(s.usuario_id), empresas=NexusDB.listarEmpresas(s.usuario_id);
document.getElementById('boas-vindas').textContent='Bem-vindo(a), '+u.nome+'.'; document.getElementById('nome-usuario').textContent=u.nome; document.getElementById('email-usuario').textContent=u.email; document.getElementById('avatar').textContent=u.nome.trim().charAt(0).toUpperCase(); document.getElementById('empresa-contagem').textContent=empresas.length;
const lista=document.getElementById('lista-empresas'); if(!empresas.length){lista.innerHTML='<div class="workspace-empty">Nenhuma empresa cadastrada.</div>'} else empresas.forEach(({empresa,vinculo})=>{const a=document.createElement('a');a.href='dashboard.html?empresa_id='+empresa.id;a.className='workspace-company-link';a.innerHTML='<div class="workspace-company-card"><div class="workspace-company-top"><span class="workspace-company-tag">Empresa</span><span class="workspace-badge">'+empresa.plano+'</span></div><h5 class="text-white">'+empresa.nome+'</h5><p class="workspace-company-description">'+(empresa.descricao||'Sem descrição.')+'</p></div>';lista.appendChild(a);});
</script></body></html>
