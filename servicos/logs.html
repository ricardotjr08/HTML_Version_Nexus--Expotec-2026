<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logs | Nexus</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><link href="../assets/css/principal.css" rel="stylesheet"><link href="../assets/css/logs.css" rel="stylesheet"></head><body class="d-flex flex-column min-vh-100"><div data-nexus-header data-base="../" data-internal="true" data-page="logs"></div><main class="flex-grow-1 py-4"><div class="container logs-shell"><section class="logs-panel"><div class="logs-header"><div><span class="logs-eyebrow">Registro</span><h1>Ocorrências e logs</h1></div></div></section><div class="logs-grid"><section class="logs-form-panel"><h2>Nova ocorrência</h2><form id="form-log" class="logs-form"><label>Tipo<select id="tipo" class="form-select"><option value="ocorrencia">Ocorrência</option><option value="suporte">Suporte</option><option value="entrada">Entrada</option><option value="saida">Saída</option><option value="ajuste">Ajuste</option></select></label><div id="mov" hidden><label>Produto<select id="produto" class="form-select"></select></label><label>Quantidade<input id="quantidade" type="number" min="1" class="form-control"></label><label>Valor unitário<input id="valor" type="number" step="0.01" class="form-control"></label></div><label id="titulo-field">Título<input id="titulo" class="form-control"></label><label id="desc-field">Descrição<textarea id="descricao" class="form-control" rows="4"></textarea></label><button class="btn btn-primary">Salvar registro</button></form></section><section class="logs-list-panel" id="lista-logs"></section></div></div></main><div data-nexus-footer data-base="../"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/js/database.js"></script><script src="../assets/js/app.js"></script><script>const s=NexusDB.session();if(!s)location.replace('../login/login.html');let empresaId=s.empresa_id||NexusDB.listarEmpresas(s.usuario_id)[0]?.empresa.id;if(!empresaId)location.replace('workspace.html');const db=NexusDB.db,produtoSel=document.getElementById('produto');db.produtos.filter(p=>p.empresa_id===empresaId).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.nome;produtoSel.appendChild(o)});function render(){const l=document.getElementById('lista-logs');l.innerHTML='';NexusDB.listarLogs(empresaId).forEach(x=>{const c=document.createElement('details');c.className='log-card';c.open=x.id===NexusDB.listarLogs(empresaId)[0]?.id;c.innerHTML='<summary><span class="log-card__title">'+x.acao.replaceAll('_',' ')+'</span><span class="log-card__meta">'+new Date(x.created_at).toLocaleString('pt-BR')+'</span></summary><div class="log-card__body">'+x.detalhes+'</div>';l.appendChild(c)});if(!l.children.length)l.innerHTML='<div class="logs-empty">Nenhum registro encontrado.</div>'}document.getElementById('tipo').onchange=e=>{const m=['entrada','saida'].includes(e.target.value);document.getElementById('mov').hidden=!m;document.getElementById('titulo-field').hidden=m;document.getElementById('desc-field').hidden=m};document.getElementById('form-log').onsubmit=e=>{e.preventDefault();const tipo=document.getElementById('tipo').value;if(['entrada','saida'].includes(tipo)){const erro=NexusDB.registrarMovimentacao(empresaId,{tipo,produto_id:Number(produtoSel.value),quantidade:Number(document.getElementById('quantidade').value),valor_unitario:Number(document.getElementById('valor').value||0),created_at:new Date().toISOString()});if(erro)return alert(erro)}else{const d=NexusDB.db;d.ocorrencias.push({id:Math.max(0,...d.ocorrencias.map(x=>x.id))+1,empresa_id:empresaId,usuario_id:s.usuario_id,tipo,titulo:document.getElementById('titulo').value,descricao:document.getElementById('descricao').value,prioridade:'media',status:'aberto',created_at:new Date().toISOString()});NexusDB.persist(d);NexusDB.log(empresaId,s.usuario_id,tipo,'suporte_ocorrencias',document.getElementById('titulo').value+': '+document.getElementById('descricao').value)}e.target.reset();render()};render();</script></body></html>
