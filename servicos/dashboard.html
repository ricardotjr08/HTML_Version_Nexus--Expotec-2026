<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Nexus</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><link href="../assets/css/principal.css" rel="stylesheet"><link href="../assets/css/dashboard.css" rel="stylesheet"></head><body class="d-flex flex-column min-vh-100"><div data-nexus-header data-base="../" data-internal="true" data-page="dashboard"></div><main class="flex-grow-1"><div class="container-fluid px-4 py-4"><h2 class="fw-bold text-white mb-4">Dashboard</h2><div class="row g-3"><div class="col-md-3"><div class="card-custom"><small class="text-secondary">Produtos</small><h3 id="kpi-produtos">0</h3></div></div><div class="col-md-3"><div class="card-custom"><small class="text-secondary">Unidades</small><h3 id="kpi-unidades">0</h3></div></div><div class="col-md-3"><div class="card-custom"><small class="text-secondary">Valor de custo</small><h3 id="kpi-custo">R$ 0</h3></div></div><div class="col-md-3"><div class="card-custom"><small class="text-secondary">Seções</small><h3 id="kpi-secoes">0</h3></div></div></div><div class="row g-3 mt-3"><div class="col-lg-8"><div class="card-custom"><h5>Produtos</h5><div class="table-responsive mt-3"><table class="table table-dark-custom"><thead><tr><th>Nome</th><th>Quantidade</th><th>Preço</th></tr></thead><tbody id="tbody-produtos"></tbody></table></div></div></div><div class="col-lg-4"><div class="card-custom"><h5>Ações rápidas</h5><div class="d-flex flex-column gap-2 mt-3"><a href="produtos.html" class="btn btn-outline-light btn-sm">Gerenciar produtos</a><a href="usuarios.html" class="btn btn-outline-light btn-sm">Gerenciar usuários</a><a href="logs.html" class="btn btn-outline-light btn-sm">Ver logs</a></div></div></div></div></div></main><div data-nexus-footer data-base="../"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/js/database.js"></script><script src="../assets/js/app.js"></script><script>const s=NexusDB.session();if(!s)location.replace('../login/login.html');let empresaId=s.empresa_id||NexusDB.listarEmpresas(s.usuario_id)[0]?.empresa.id;if(!empresaId)location.replace('workspace.html');const d=NexusDB.db,prod=d.produtos.filter(p=>p.empresa_id===empresaId),secs=d.secoes.filter(x=>x.empresa_id===empresaId);document.getElementById('kpi-produtos').textContent=prod.length;document.getElementById('kpi-unidades').textContent=prod.reduce((n,p)=>n+Number(p.quantidade),0);document.getElementById('kpi-custo').textContent='R$ '+prod.reduce((n,p)=>n+Number(p.quantidade)*Number(p.custo),0).toLocaleString('pt-BR',{minimumFractionDigits:2});document.getElementById('kpi-secoes').textContent=secs.length;const tb=document.getElementById('tbody-produtos');prod.forEach(p=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+p.nome+'</td><td>'+p.quantidade+'</td><td>R$ '+Number(p.preco).toFixed(2)+'</td>';tb.appendChild(tr)});</script></body></html>
