<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Nexus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/principal.css" rel="stylesheet">
    <link href="../assets/css/autenticacao.css" rel="stylesheet">
</head>
<body>

<div class="auth-page">

    <div class="auth-visual">
        <p>Controle seu estoque de forma simples.</p>
    </div>

    <main class="auth-side">
        <div class="auth-box">
            <a href="../index.html" class="auth-logo">
                <div class="logo-icon me-2">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <span class="fw-semibold fs-5">Nexus</span>
            </a>

            <h1>Acesse sua conta</h1>
            <p class="auth-sub">Digite seus dados para acessar sua conta.</p>

            <div id="aviso" class="aviso" role="alert"></div>

            <form id="form-login">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
                        <button type="button" class="btn-mostrar" data-alvo="senha">Mostrar</button>
                    </div>
                </div>

                <button type="submit" class="btn-auth">Entrar</button>
            </form>

            <p class="auth-troca">Ainda não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
        </div>
    </main>

</div>

<script src="../assets/js/database.js"></script>
<script>
    document.querySelectorAll('.btn-mostrar').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var campo = document.getElementById(btn.dataset.alvo);
            var oculta = campo.type === 'password';
            campo.type = oculta ? 'text' : 'password';
            btn.textContent = oculta ? 'Ocultar' : 'Mostrar';
        });
    });

    var aviso = document.getElementById('aviso');
    var params = new URLSearchParams(window.location.search);
    if (params.has('ok')) {
        aviso.textContent = 'Conta criada! Entre com seu e-mail e senha.';
        aviso.className = 'aviso sucesso';
    }

    document.getElementById('form-login').addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var senha = document.getElementById('senha').value;
        var sessao = NexusDB.login(email, senha);
        if (!sessao) {
            aviso.textContent = 'E-mail ou senha incorretos.';
            aviso.className = 'aviso erro';
            return;
        }
        window.location.href = '../servicos/workspace.html';
    });
</script>

</body>
</html>
